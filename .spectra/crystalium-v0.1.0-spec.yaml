---
# CRYSTALIUM v0.1.0 — machine-readable spec
# Sibling to crystalium-v0.1.0-spec.md. Consumed by APIVR-Δ for wave-by-wave implementation.
# Every config default is annotated with its source FORGE decision (D1..D9) or MISSION P0 anchor.

spec_version: "1.0"
crystalium_version: "0.1.0"
authors: ["forge", "spectra"]
date: "2026-05-28"
phase: "S"   # SPECTRA Alignment

inputs:
  mission: "MISSION.md"
  scout: ".atlas/scout-report.md"
  reasoning: ".forge/reasoning-report.md"

reference_only:
  - "atlas-aci/mcp-server/src/atlas_aci/enforcement.py"
  - "atlas-aci/mcp-server/src/atlas_aci/server.py"
  - "atlas-aci/mcp-server/src/atlas_aci/config.py"
  - "eidolons-ecl/schemas/envelope.v2.json"
  - "eidolons-ecl/schemas/performative.v1.json"
  - "eidolons-eiis/spec/eiis-1.4.md"
  - "Junction/cmd/junction/mcp.go"
  - "Junction/internal/mcp/server.go"
  - "Junction/internal/mcp/tools.go"

# --------------------------------------------------------------------------
# P0 non-negotiables (from MISSION §2.2 + FORGE reasoning carry-through)
# --------------------------------------------------------------------------
non_negotiables:
  - id: "P0-1"
    text: "Capture is ungated into raw Episodic buffer, always validation_state=quarantined. Gate promotion, not capture."
    source: "MISSION.md:38-41"
  - id: "P0-2"
    text: "T3 content writes ONLY Episodic-quarantined. Never Semantic/Procedural directly."
    source: "MISSION.md:42-44"
  - id: "P0-3"
    text: "Procedural admission requires the skill's verifier to pass in a sandbox."
    source: "MISSION.md:45-46"
  - id: "P0-4"
    text: "Semantic promotion requires >=k independent corroborating sources OR human confirmation."
    source: "MISSION.md:47-49"
  - id: "P0-5"
    text: "Updates are bi-temporal: invalidate-old (t_valid_to=now, superseded_by=<new id>), write-new. Never hard-delete."
    source: "MISSION.md:50-52"
  - id: "P0-6"
    text: "Trust tier carries through cross-agent reads and through summarization. Consolidated crystal takes MIN trust tier, never resets to T1."
    source: "MISSION.md:53-56"
  - id: "P0-7"
    text: "Path-traversal guard + per-process rate limit + telemetry on every call, exactly as atlas-aci does."
    source: "MISSION.md:57-58"
  - id: "P0-8"
    text: "Index -> pointer -> content: expensive stores hold only indices+metadata; full payloads in cheap content-addressed blob tier."
    source: "MISSION.md:60-63"
  - id: "P0-9"
    text: "Bounded slotted working set: composer assembles <=3500 tokens from typed slots with hard caps and deterministic eviction."
    source: "MISSION.md:67-74"
  - id: "P0-10"
    text: "Dream is async, off hot path. Triggers: idle/end-of-session -> event-count -> nightly cron. May only PROPOSE Semantic upserts."
    source: "MISSION.md:78-83"
  - id: "P0-11"
    text: "Importance function f(access_frequency, recency, outcome_success, novelty) used for BOTH write-gate and forget-weight."
    source: "MISSION.md:85-86"
  - id: "P0-12"
    text: "Every crystal carries scope=(project, agent_class_visibility, sensitivity_tag). Redactor regex+small-LLM judge between retrieval and LLM. Re-redact at every cross-agent handoff."
    source: "MISSION.md:88-92"
  - id: "P0-13"
    text: "Container-first. Every toolchain dep installs inside Docker. Host runs only docker compose + git. No host-side pip/uv/python/pytest/model-downloads."
    source: "MISSION.md:114-117"
  - id: "P0-14"
    text: "agent.md <=1000 tokens; composer-proven <=3500 tokens."
    source: "MISSION.md:145"
  - id: "P0-15"
    text: "Every P0 invariant has a passing test in test_enforcement.py (or equivalent). Failure marks server non-conformant."
    source: "MISSION.md:146-147"
  - id: "P0-16"
    text: "install.sh idempotent (CI second-run-no-diff job)."
    source: "MISSION.md:148"
  - id: "P0-17"
    text: "Memory-on/off A/B is the headline metric. If memory does not beat no-memory on canaries, say so plainly."
    source: "MISSION.md:163-164"

# --------------------------------------------------------------------------
# Validation gates G1..G8 (full GIVEN/WHEN/THEN + test anchor)
# --------------------------------------------------------------------------
gates:
  G1:
    name: "T3 cannot commit above Episodic"
    given: "A caller advertising trust_tier=T3 (environment/tool-ingested)."
    when: "It invokes crystalium.commit(layer in {Semantic, Procedural, Execution}, payload, provenance)."
    then: "enforcement.assert_tier_allowed raises TierViolation before any store mutation runs."
    test_anchor: "mcp-server/tests/test_enforcement.py::test_g1_t3_cannot_commit_above_episodic"
    failure_class: "TierViolation"
    tier_violated: "T3"
    severity: "P0"
    derived_from: "D1"
  G2:
    name: "T2 procedural commits land as candidate"
    given: "A caller advertising trust_tier=T2 (unverified)."
    when: "It invokes crystalium.commit(layer=Procedural, payload, provenance)."
    then: "Record is admitted with validation_state='candidate'; promotion to 'admitted' rejected until T0/T1 caller runs skill_invoke and verifier passes (G3 path)."
    test_anchor: "mcp-server/tests/test_enforcement.py::test_g2_t2_procedural_candidate_only"
    failure_class: "PromotionGated"
    tier_violated: "T2"
    severity: "P0"
    derived_from: "D1"
  G3:
    name: "Procedural verifier-gated admission"
    given: "A procedural candidate skill_id exists in the candidate state."
    when: "crystalium.skill_invoke(skill_id, args) is called."
    then: "Subprocess runs with timeout_s<=30, output_cap_bytes<=8192, cwd resolved (Path.resolve(strict=True)) under /sandbox/<skill_id>, operator-warning logged. Exit-code 0 + no overflow -> promote to admitted; else candidate untouched."
    test_anchor: "mcp-server/tests/test_skill_invoke.py::test_g3_skill_invoke_sandbox_contract"
    failure_class: "SkillVerifierFailed|SkillTimeout|SkillOutputOverflow|SkillPathEscape"
    tier_violated: "n/a"
    severity: "P0"
    derived_from: "D5"
  G4:
    name: "Trust-tier propagation blocks T3 laundering"
    given: "A summarizer reads inputs whose trust tiers are {T1, T2, T3}."
    when: "It invokes crystalium.commit(layer=Semantic, payload=<consolidated>)."
    then: "enforcement computes consolidated.tier = min(inputs.tier) = T3; admission rejected with TierCeilingViolation; structured advice 'exclude T3 inputs or commit to Episodic instead' returned."
    test_anchor: "mcp-server/tests/test_trust_propagation.py::test_g4_min_tier_blocks_semantic_laundering"
    failure_class: "TierCeilingViolation"
    tier_violated: "T3 (effective)"
    severity: "P0"
    derived_from: "D7"
  G5:
    name: "Human-confirm default window"
    given: "install_ts within last 30 days AND operator has not set human_confirm=false in crystalium.yaml."
    when: "A promotion is proposed (any layer)."
    then: "Record lands in pending_promotions table; does NOT enter target layer until 'crystalium promote review <id> --accept'. CRYSTALIUM_AUTO_CONFIRM=1 bypasses (test-only) with WARN log."
    test_anchor: "mcp-server/tests/test_promotion_gate.py::test_g5_human_confirm_default_window"
    failure_class: "PromotionPending"
    tier_violated: "n/a"
    severity: "P0"
    derived_from: "D8"
  G6:
    name: "Working-set budget invariant"
    given: "Composer is asked to assemble a working set whose pre-eviction serialized tokens exceed any slot cap."
    when: "composer.compose(scope) runs."
    then: "For every slot in {executive, procedural, semantic, episodic, execution, buffer}, slot.tokens<=slot.cap AND total<=3500. Eviction deterministic: pop lowest tuple (importance, last_access, record_id) ascending. Tie-break by last_access, then record_id."
    test_anchor: "mcp-server/tests/test_composer.py::test_g6_working_set_budget_invariant"
    failure_class: "WorkingSetOverflow"
    tier_violated: "n/a"
    severity: "P0"
    derived_from: "D9"
  G7:
    name: "ECL envelope conformance per tool result"
    given: "Any crystalium.* MCP tool result that produces a payload artefact."
    when: "Result is written to disk."
    then: "Sibling ecl-envelope.<message_id>.json exists, validates against envelope.v2.json, carries all 11 required ECL v2.0 fields. integrity.method='sha256'. integrity.value == hashlib.sha256(payload_bytes).hexdigest() == artifact.sha256. from.eidolon='crystalium', from.version=__version__."
    test_anchor: "mcp-server/tests/test_ecl_envelope.py::test_g7_every_tool_result_emits_valid_envelope"
    failure_class: "EnvelopeMissing|EnvelopeInvalid|EnvelopeIntegrityMismatch"
    tier_violated: "n/a"
    severity: "P0"
    derived_from: "D4"
  G8:
    name: "Dream dedup on idle + event triggers"
    given: "No commits/recalls for idle_threshold_s=300 AND now-last_dream>=min_dream_gap_s=1800."
    when: "Poll scheduler ticks at dream_tick_s=60."
    then: "Exactly one Dream run is enqueued; session_end tool + idle-poll + event-count threshold share one enqueue path keyed by dream_run_id; concurrent triggers dedup to one execution."
    test_anchor: "mcp-server/tests/test_dream_scheduler.py::test_g8_dream_dedup_on_concurrent_triggers"
    failure_class: "DreamSchedulerInvariant"
    tier_violated: "n/a"
    severity: "P1"
    derived_from: "D3"

# --------------------------------------------------------------------------
# Tier x Layer x Operation matrix (D1)
# --------------------------------------------------------------------------
tier_matrix:
  episodic:
    commit:           { T0: "allow",  T1: "allow",  T2: "allow",  T3: "allow_quarantine" }
    propose_promote:  { T0: "allow",  T1: "allow",  T2: "deny",   T3: "deny" }
    force_promote:    { T0: "allow",  T1: "deny",   T2: "deny",   T3: "deny" }
  semantic:
    commit:           { T0: "allow",  T1: "allow",  T2: "deny",   T3: "deny" }
    propose_promote:  { T0: "allow",  T1: "allow",  T2: "deny",   T3: "deny" }
    force_promote:    { T0: "allow",  T1: "deny",   T2: "deny",   T3: "deny" }
  procedural:
    commit_candidate: { T0: "allow",  T1: "allow",  T2: "allow",  T3: "deny" }
    propose_promote:  { T0: "allow",  T1: "allow",  T2: "deny",   T3: "deny" }
    force_promote:    { T0: "allow",  T1: "deny",   T2: "deny",   T3: "deny" }
  execution:
    commit:           { T0: "allow",  T1: "allow",  T2: "deny",   T3: "deny" }
    propose_promote:  { T0: "n/a",    T1: "n/a",    T2: "n/a",    T3: "n/a" }
    force_promote:    { T0: "n/a",    T1: "n/a",    T2: "n/a",    T3: "n/a" }
  any:
    recall:           { T0: "allow",  T1: "allow",  T2: "allow",  T3: "allow" }

tier_matrix_notes:
  - "recall is universally allowed; read-side trust enforced via D7 propagation (min(inputs.tier)) on any downstream commit, not at recall time."
  - "allow_quarantine is an enforcement-side flag (_MARK_QUARANTINE.set(True)) consumed by the commit handler; never a caller-supplied argument."
  - "Procedural commit (candidate) for T1/T2 lands in validation_state='candidate'; promotion to 'admitted' requires skill_invoke verifier-pass (G3)."
  - "force_promote is reserved to T0; goes straight through; audit via telemetry record (OQ-1)."
  - "Execution layer has no propose_promote; ephemeral TTL-bound."

# --------------------------------------------------------------------------
# Tool surface (seven tools) — D3 added session_end
# --------------------------------------------------------------------------
tool_surface:
  - name: "crystalium.recall"
    inputs:
      scope: "Scope"
      query: "string"
      k: "int"
      layers: "Layer[]"
    output: "RecallResult"
    gates_traversed: []
    enforcement_order:
      - "assert_rate_limit"
      - "assert_no_path_escape (for blob-tier resolves)"
      - "tool_impl"
      - "redactor_pass"
      - "record"
    ecl_envelope: true
    ecl_performative: "INFORM"
    artifact_kind: "recall-result"
    failure_classes: ["RateLimitExceeded","PathEscape","RedactionFailure","StoreUnavailable"]

  - name: "crystalium.commit"
    inputs:
      layer: "Layer"
      payload: "CommitPayload"
      provenance: "Provenance"
    output: "CommitResult"
    gates_traversed: ["G1","G2","G4","G5","G7"]
    enforcement_order:
      - "assert_rate_limit"
      - "assert_tier_allowed(tool='crystalium.commit', layer, tier, op='commit')"
      - "assert_no_path_escape(blob_tier_target)"
      - "bi_temporal_write (invalidate-old, write-new)"
      - "enqueue_dream_hint"
      - "emit_envelope_sidecar"
      - "record"
    ecl_envelope: true
    ecl_performative: "INFORM | PROPOSE"
    artifact_kind: "commit-result"
    failure_classes: ["TierViolation","TierCeilingViolation","PromotionGated","PromotionPending","BiTemporalIntegrityFailure","PathEscape","RateLimitExceeded"]

  - name: "crystalium.update"
    inputs:
      id: "CrystalId"
      patch: "UpdatePatch"
      reason: "string"
    output: "UpdateResult"
    gates_traversed: ["G1","G4","G7"]
    enforcement_order:
      - "assert_rate_limit"
      - "assert_tier_allowed(op='commit')"
      - "fetch_existing"
      - "write_old(t_valid_to=now, superseded_by=<new_id>)"
      - "write_new_revision"
      - "emit_envelope_sidecar"
      - "record"
    ecl_envelope: true
    ecl_performative: "INFORM"
    artifact_kind: "commit-result"
    failure_classes: ["TierViolation","BiTemporalIntegrityFailure","CrystalNotFound","PathEscape","RateLimitExceeded"]

  - name: "crystalium.skill_invoke"
    inputs:
      skill_id: "string"
      args: "dict"
      timeout_s: "int"
      output_cap_bytes: "int"
      workdir: "Path"
    output: "SkillResult"
    gates_traversed: ["G3","G7"]
    enforcement_order:
      - "assert_rate_limit"
      - "assert_no_path_escape(workdir, expected_prefix='/sandbox/<skill_id>', strict=True)"
      - "log_operator_warning"
      - "subprocess.run(timeout=timeout_s)"
      - "check_output_cap(output_cap_bytes)"
      - "emit_envelope_sidecar"
      - "record"
    ecl_envelope: true
    ecl_performative: "INFORM | REFUSE"
    artifact_kind: "skill-result"
    failure_classes: ["SkillVerifierFailed","SkillTimeout","SkillOutputOverflow","SkillPathEscape","RateLimitExceeded"]

  - name: "crystalium.plan_checkpoint"
    inputs:
      state: "PlanState"
    output: "CheckpointResult"
    gates_traversed: ["G1","G7"]
    enforcement_order:
      - "assert_rate_limit"
      - "assert_tier_allowed(layer=Execution, op='commit')"
      - "write_execution_ttl_bound"
      - "emit_envelope_sidecar"
      - "record"
    ecl_envelope: true
    ecl_performative: "INFORM"
    artifact_kind: "plan-checkpoint"
    failure_classes: ["TierViolation","ExecutionTTLExpired","RateLimitExceeded"]

  - name: "crystalium.plan_replan"
    inputs:
      diff: "PlanDiff"
    output: "ReplanResult"
    gates_traversed: ["G1","G7"]
    enforcement_order:
      - "assert_rate_limit"
      - "assert_tier_allowed(layer=Execution, op='commit')"
      - "invalidate_old_plan_node"
      - "write_new_with_superseded_by"
      - "emit_envelope_sidecar"
      - "record"
    ecl_envelope: true
    ecl_performative: "INFORM"
    artifact_kind: "plan-replan"
    failure_classes: ["TierViolation","ExecutionTTLExpired","PlanNotFound","RateLimitExceeded"]

  - name: "crystalium.session_end"
    inputs:
      reason: "string"
    output: "SessionEndResult"
    gates_traversed: ["G8","G7"]
    enforcement_order:
      - "assert_rate_limit"
      - "resolve_dream_run_id(now, last_dream)"
      - "enqueue_dream_via_shared_scheduler"
      - "emit_envelope_sidecar"
      - "record"
    ecl_envelope: true
    ecl_performative: "ACKNOWLEDGE"
    artifact_kind: "session-end-receipt"
    failure_classes: ["SchedulerUnavailable","RateLimitExceeded"]
    new_in_v0_1: true
    rationale: "FORGE D3 — host-cooperative fast-path complementing the 60s idle-poll floor."

# --------------------------------------------------------------------------
# Config defaults — every value traceable to a FORGE decision
# --------------------------------------------------------------------------
config_defaults:
  # transport (D2)
  transport: "stdio"                          # D2
  http_branch_behavior: "NotImplementedError(\"v0.2\")"  # D2

  # Dream scheduler (D3)
  idle_threshold_s: 300                       # D3
  min_dream_gap_s: 1800                       # D3
  dream_tick_s: 60                            # D3

  # ECL (D4)
  ecl_version: "2.0"                          # D4
  ecl_to_eidolon_unknown_default: "unknown"   # D4 (OQ-3 reviews)
  ecl_message_id_strategy: "uuid4 (uuid7 preferred when stdlib supports)"  # D4 / [UNVERIFIED]
  ecl_edge_origin: "implicit"                 # FINDING-002 guidance

  # skill_invoke sandbox (D5)
  skill_invoke_timeout_s: 30                  # D5
  skill_invoke_output_cap_bytes: 8192         # D5
  skill_invoke_workdir_prefix: "/sandbox/"    # D5
  skill_invoke_path_resolve_strict: true      # D5 + OQ-7

  # importance (D6) — FROZEN signature
  importance_weights: [0.25, 0.30, 0.25, 0.20]   # D6  (access_freq, recency, outcome, novelty)
  importance_recency_halflife_days: 14.0         # D6  (OQ-4 reviews)
  importance_access_freq_cap: 100                # D6  (log1p denominator)

  # Promotion gate (D8)
  k_corroboration: 3                          # D8
  human_confirm_default_window_days: 30       # D8
  auto_confirm_env_var: "CRYSTALIUM_AUTO_CONFIRM"  # D8 (test-only)

  # Rate limiting (P0-7, atlas-aci pattern)
  max_calls_per_minute: 200                   # atlas-aci default

  # Storage paths
  blob_tier_root: "~/.crystalium/<project>/"  # MISSION.md:62-63
  sqlite_path: "~/.crystalium/<project>/index.sqlite"
  lance_path: "~/.crystalium/<project>/vectors.lance"
  kuzu_path: "~/.crystalium/<project>/graph.kuzu"

  # Reranker
  reranker_enabled_when_k_gt: 20              # MISSION.md:106

  # Telemetry
  structlog_format: "jsonl"
  otel_enabled: true

# --------------------------------------------------------------------------
# Working-set composer slots (P0-9, restated FORGE D9)
# --------------------------------------------------------------------------
slots:
  executive: 300
  procedural: 600
  semantic: 800
  episodic: 800
  execution: 1000
  buffer: 300
  total_cap: 3500

eviction_rule:
  algorithm: "highest_importance_first_kept"
  tuple_sort_ascending: ["importance", "last_access", "record_id"]
  tokenizer_preference: ["tiktoken cl100k_base", "harness_tokenizer", "len(text)//4 [UNVERIFIED fallback]"]
  determinism: "same inputs -> same kept set, same order (asserted by G6 test)"
  derived_from: "D9"

