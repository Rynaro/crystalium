source_of_truth_attribution:
  "mcp-server/src/crystalium/enforcement.py": "atlas-aci/mcp-server/src/atlas_aci/enforcement.py (FINDING-001)"
  "mcp-server/src/crystalium/server.py": "atlas-aci/mcp-server/src/atlas_aci/server.py (FINDING-001 wiring)"
  "mcp-server/src/crystalium/ecl.py": "eidolons-ecl/schemas/envelope.v2.json + conformance/lib/integrity.sh (FINDING-002)"
  "install.sh": "eidolons-eiis/spec/eiis-1.4.md Appendix A cleanup_inventory_sweep (FINDING-003)"
  "EIIS_VERSION content": "EIIS v1.4 §1.1"
  "ECL_VERSION content": "FORGE D4; EIIS §3.7.1 install obligation"
  "schemas/install.manifest.v1.json": "EIIS v1.4 §1.8 manifest schema"
  "mcp-server/src/crystalium/dream/scheduler.py": "NOT Junction sync dispatch; apscheduler/arq OUTSIDE MCP request context (FINDING-004 caveat)"
  "mcp-server/src/crystalium/importance.py": "FORGE D6 — signature FROZEN; only WEIGHTS tuple is the D11 swap point"
  "Dockerfile / docker-compose*.yml": "Container-first rule (MISSION.md:114-117)"

