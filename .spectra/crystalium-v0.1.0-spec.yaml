      - "install.sh idempotent (CI second-run-no-diff job)"
      - "agent.md <= 1000 tokens (test_meta)"
      - "DESIGN-RATIONALE citations >= 10"
    container_test: "docker compose run --rm crystalium pytest mcp-server/tests/ -v && docker compose run --rm crystalium bash install.sh --target /tmp/install1 && docker compose run --rm crystalium bash install.sh --target /tmp/install1 && docker compose run --rm crystalium diff -r /tmp/install1 /tmp/install1.snapshot"
    commit_subject: "feat(install,ci,docs): EIIS v1.4 install.sh + CI workflows + DESIGN-RATIONALE + CHANGELOG"

# --------------------------------------------------------------------------
# Container-first protocol (MUST appear here AND in spec.md §10)
# --------------------------------------------------------------------------
container_first_protocol:
  rule: "Every wave's test command runs INSIDE 'docker compose run --rm crystalium ...'. APIVR-Δ MUST NOT invoke host python/pip/uv/pytest/node."
  host_allowed_tools: ["docker", "git", "make"]
  apivr_bash_policy_note: "pytest:* policy is honoured by running pytest THROUGH docker compose. The executing process is docker compose, not pytest."
  makefile_wrapper: "All Makefile targets shell out via 'docker compose run --rm'. Never 'python -m pytest'."
  ci_mirror: "GitHub Actions runs the same 'docker compose run --rm crystalium pytest' invocations. No pip install step."
  failure_mode: "If any wave's container_test omits 'docker compose run --rm', the spec has failed validation. APIVR-Δ should reject and request SPECTRA re-run."

# --------------------------------------------------------------------------
# EIIS v1.4 conformance plan
# --------------------------------------------------------------------------
eiis_v1_4_conformance:
  source_repo_required_files:
    - "agent.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "README.md"
    - "install.sh"
    - "EIIS_VERSION"           # content: "1.4"
    - "ECL_VERSION"            # content: "2.0" (D4)
  install_target_whitelist:
    must:
      - { path: "<target>/agent.md", role: "agent-profile" }
      - { path: "<target>/SPEC.md", role: "spec" }
      - { path: "<target>/install.manifest.json", role: "manifest" }
      - { path: "<target>/ECL_VERSION", role: "ecl-version" }
    may:
      - "<target>/skills/<skill>.md"
      - "<target>/templates/<artifact>.md"
      - "<target>/schemas/<aux>.json"
    should:
      - "<target>/schemas/install.manifest.v1.json"
  install_target_forbidden:
    - "CRYSTALIUM.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "README.md"
    - "CHANGELOG.md"
    - "DESIGN-RATIONALE.md"
    - "MISSION.md"
    - "SKILL.md"
    - "skills/<phase>/SKILL.md"
    - "hosts/"
    - "evals/"
    - "research/"
    - "tools/"
    - "commands/"
    - "mcp-server/"
    - "Dockerfile"
    - "docker-compose.yml"
    - "pyproject.toml"
  v1_4_obligations:
    - "§1.8.6: agent.md recorded in files_written[] with role='agent-profile' exactly once."
    - "§3.7.1: ECL_VERSION recorded in files_written[] with role='ecl-version' and verbatim-equal SHA-256."
    - "§4.2.3: claude-code dispatch file references both agent.md AND SPEC.md."
    - "§6.X: cleanup_inventory_sweep after install removes non-whitelisted files (Appendix A bash 3.2 ref impl)."
    - "§6.Y: every skills/<skill>.md reference in agent.md resolves to a files_written[] entry."

# --------------------------------------------------------------------------
# ECL v2.0 conformance plan
# --------------------------------------------------------------------------
ecl_v2_0_conformance:
  declared_version: "2.0"
  per_tool_result_envelope: true
  required_fields:
    - "envelope_version"
    - "message_id"
    - "thread_id"
    - "parent_id"
    - "from"
    - "to"
    - "performative"
    - "objective"
    - "artifact"
    - "integrity"
    - "trace"
  artifact_subfields_required: ["kind", "schema_version", "path", "sha256", "size_bytes"]
  integrity_method: "sha256"
  integrity_value_rule: "lowercase hex of hashlib.sha256(payload_bytes).hexdigest()"
  artifact_sha256_rule: "MUST equal integrity.value"
  from_eidolon: "crystalium"
  from_version_source: "__version__ in mcp-server/src/crystalium/__init__.py"
  to_eidolon_default: "unknown"          # OQ-3 reviews
  edge_origin: "implicit"
  performative_set_size: 10
  performatives_used:
    - "INFORM"
    - "PROPOSE"
    - "REFUSE"
    - "ACKNOWLEDGE"
  sidecar_naming: "ecl-envelope.<message_id>.json (sibling to payload)"
  helper_module: "mcp-server/src/crystalium/ecl.py"

# --------------------------------------------------------------------------
# Canary suite (10 missions)
# --------------------------------------------------------------------------
canary_missions:
  - id: "CAN-1"
    name: "recall_hit_across_sessions"
    scenario: "Commit a fact in session A; recall in fresh session B with the same scope."
    oracle: "Memory-off returns nothing relevant; memory-on returns committed crystal in top-3."
    pass: "Memory-on mrr@3 > 0 AND memory-off mrr@3 == 0"
    ab_arm: true
  - id: "CAN-2"
    name: "promote_gate_T3_blocked"
    scenario: "T3 caller attempts commit(layer=Semantic)."
    oracle: "TierViolation raised; no store write."
    pass: "G1 test_anchor passes; semantic store row count unchanged"
    ab_arm: false
  - id: "CAN-3"
    name: "poisoning_resistance_t3_episodic_only"
    scenario: "T3 tool-origin content is committed and attempts to reach Semantic."
    oracle: "T3 content stays Episodic-quarantined; never promoted to Semantic."
    pass: "Quarantine/tier test_anchor passes; no T3-origin row reaches the semantic store"
    ab_arm: true
  - id: "CAN-4"
    name: "selective_forget_superseded"
    scenario: "Update a fact (e.g. bcrypt -> argon2): invalidate-old + write-new with superseded_by."
    oracle: "Default recall returns the new crystal; old remains with t_valid_to set; no hard-delete."
    pass: "Bi-temporal integrity + superseded_by correct (evals/selective_forgetting.py)"
    ab_arm: true
  - id: "CAN-5"
    name: "multi_agent_isolation"
    scenario: "Two agent_class_visibility scopes commit overlapping facts."
    oracle: "Scope isolation honoured; recall from A returns zero B crystals."
    pass: "Recall result for scope A contains zero scope-B crystals"
    ab_arm: true
  - id: "CAN-6"
    name: "procedural_verifier_required"
    scenario: "Submit a Procedural skill without a verifier; then resubmit with a passing verifier."
    oracle: "No-verifier stays candidate; passing verifier -> shared."
    pass: "G3 path exercised; both branches' test_anchors pass"
    ab_arm: false
  - id: "CAN-7"
    name: "bitemporal_correctness"
    scenario: "Update a crystal; inspect bi-temporal fields on the superseded record."
    oracle: "t_valid_to + superseded_by set on the old record; no hard-delete."
    pass: "Bi-temporal correctness assertion (test_bitemporal.py)"
    ab_arm: false
  - id: "CAN-8"
    name: "working_set_budget_invariant"
    scenario: "Compose with overload set 3x cap."
    oracle: "Composer enforces per-slot + 3500 total caps; eviction deterministic."
    pass: "G6 test_anchor passes"
    ab_arm: false
  - id: "CAN-9"
    name: "ecl_envelope_conformance"
    scenario: "Recall + commit + update emit envelopes."
    oracle: "All three envelopes validate against envelope.v2.json; SHA-256 matches."
    pass: "G7 test_anchor passes; jsonschema validation green"
    ab_arm: false
  - id: "CAN-10"
    name: "dream_dedup"
    scenario: "Trigger session_end + idle-poll + event-count concurrently."
    oracle: "Exactly one Dream run enqueued."
    pass: "G8 test_anchor passes"
    ab_arm: false

headline_ab_metric:
  description: "Memory-on beats memory-off on >=80% of A/B-eligible canaries (CAN-1, CAN-3, CAN-4, CAN-5). Source of truth: evals/missions.py AB_ARM_MISSION_IDS."
  pass_threshold: 0.80
  failure_handling: "Report plainly as '[UNVERIFIED — memory does not measurably help on this canary set]' per MISSION.md:163."

# --------------------------------------------------------------------------
# Quality bars (P0-14..P0-17 + MISSION §8)
# --------------------------------------------------------------------------
quality_bars:
  agent_md_token_cap: 1000
  agent_md_line_cap_proxy: 60
  composer_token_cap: 3500
  canary_pass_target: 0.80
  conformance_tests_must_pass: 8
  install_sh_idempotent: true
  design_rationale_min_citations: 10
  unverified_markers_required: true     # at least uuid7 lib + tiktoken fallback
  branch_naming: "feat/crystalium-v0.1.0"
  push_or_pr_in_v0_1: false
  changelog_format: "Keep-a-Changelog"
  commit_style: "Conventional Commits"

# --------------------------------------------------------------------------
# Open Questions (OQ-1..OQ-10) — NOT for re-decision; for human review post-v0.1
# --------------------------------------------------------------------------
oqs:
  - id: "OQ-1"
    text: "force_promote (T0 only) — straight-through or also require pending_promotions entry for audit? Current: straight-through; audit via telemetry record."
  - id: "OQ-2"
    text: "Dream's prune step — does it call assert_tier_allowed as a synthetic T0? Recommend yes; needs explicit T0 service identity."
  - id: "OQ-3"
    text: "Envelope to.eidolon for T2/T3 callers without identity headers: 'unknown' (current D4) or refuse the call?"
  - id: "OQ-4"
    text: "RECENCY_HALFLIFE_DAYS=14 may overweight stale data in long-lived workspaces. Operator-tunable?"
  - id: "OQ-5"
    text: "k=3 with three independent T1+ witnesses hard to accumulate in single-operator workflows. Auto-relax to 2 if only one Eidolon installed?"
  - id: "OQ-6"
    text: "session_end tool exists per D3 but Junction is sync-only (FINDING-004); does Junction need a wrapper to call it on its own shutdown path?"
  - id: "OQ-7"
    text: "Path-traversal guard radius: /sandbox/<skill_id> only, or also block symlink escapes? Recommend resolve(strict=True) + reject if outside."
  - id: "OQ-8"
    text: "ECL trace.tier — caller's tier or crystalium's (always T1 service)? Suggest caller's."
  - id: "OQ-9"
    text: "Importance novelty_at_write is frozen at write time; should Dream recompute as neighbourhood shifts? Current design says no; flag for D11."
  - id: "OQ-10"
    text: "(SPECTRA new) Envelope objective field for tool calls — auto-generate from (tool_name, layer, scope.project) or require callers to pass via MCP extension field? Current: auto-generate; revisit if multi-Eidolon hand-offs need richer objective text."

# --------------------------------------------------------------------------
# Out-of-scope hooks (per MISSION §7 + FORGE D2)
# --------------------------------------------------------------------------
out_of_scope_hooks:
  polyglot_skills: "schemas/skill.v1.json fields: language (enum) + capability_class"
  adaptive_importance: "mcp-server/src/crystalium/importance.py WEIGHTS tuple — module-level constant; D11 mutates only this"
  drift_detection: "provenance field on every crystal + telemetry.py audit log sink"
  quarantine_ui: "validation_state='quarantined' field on Episodic records; 'crystalium promote review' CLI"
  server_profile: "config.profile: 'local'|'server' Pydantic field; 'server' branch raises NotImplementedError('v0.2')"
  langgraph_adapter: "n/a — explicitly excluded by MISSION.md:111; no hook"
  in_weights_consolidation: "n/a — foreclosed by D9"
  multi_agent_crdt: "superseded_by field on every crystal + append-only blob tier; LWW is v0.1 conflict rule"
  rem_associative_linkage: "n/a"
  streamable_http: "CRYSTALIUM_TRANSPORT={stdio,http} env var; http branch raises NotImplementedError('v0.2') (FORGE D2)"

# --------------------------------------------------------------------------
# Security surface (per-layer table) — per MISSION §Security
# --------------------------------------------------------------------------
security_surface:
  episodic:
    context_consumed: "Past mission/session/PR pointers from caller"
    persists: "~/.crystalium/<project>/episodic/ (SQLite indices + blob tier)"
    external_calls: "none (fully local)"
    failure_mode: "Caller spoofs T0 to commit T3 content above quarantine"
    mitigation: "G1 chokepoint test + telemetry log of every tier assertion"
  semantic:
    context_consumed: "Curated facts; conventions; signatures"
    persists: "~/.crystalium/<project>/semantic/ (LanceDB + KuzuDB + SQLite)"
    external_calls: "none"
    failure_mode: "T3 launders content via summarizer"
    mitigation: "G4 (D7 MIN-trust propagation); admission denied with structured advice"
  procedural:
    context_consumed: "Verifier scripts + skill frontmatter"
    persists: "~/.crystalium/<project>/procedural/ (blob + SQLite)"
    external_calls: "subprocess executes verifier in container"
    failure_mode: "Malicious verifier consumes CPU / fills stdout / probes container"
    mitigation: "G3 sandbox: /sandbox/<skill_id> cwd, Path.resolve(strict=True), 30s timeout, 8 KiB output cap, operator-warning log; OS isolation is operator's responsibility"
  execution:
    context_consumed: "In-flight plan state, replan diffs"
    persists: "~/.crystalium/<project>/execution/ (SQLite, TTL)"
    external_calls: "none"
    failure_mode: "Plan persists past task end"
    mitigation: "TTL enforced at recall + nightly Dream prune"
  cross_cutting_controls:
    - "Path-traversal guard: Path.resolve(strict=True) then relative_to(repo_or_sandbox_root)"
    - "Per-process rate limit: sliding 60s window deque; default 200 calls/min"
    - "Telemetry on every call: structlog JSONL + OpenTelemetry; redacted args (never log raw content)"
    - "Redaction: regex pre-pass + local LLM judge on sensitivity-tagged content; re-applied at every cross-agent handoff"

# --------------------------------------------------------------------------
# Spec scorecard — APIVR-Δ scores 1..5; pass bar = >=4 on every criterion
# --------------------------------------------------------------------------
scorecard:
  - id: 1
    criterion: "Mechanical invariants present"
    how_to_score: "All 8 gates have test_anchor pointing to concrete file + test name (§3 of spec.md, gates: block of spec.yaml)."
  - id: 2
    criterion: "Wave plan executable"
    how_to_score: "Each W1..W6 has clean inputs (files: block), clean outputs (commit_subject), container_test command."
  - id: 3
    criterion: "Container-first compliance"
    how_to_score: "Every container_test starts with 'docker compose run --rm crystalium'. One host-shell-out = score 1."
  - id: 4
    criterion: "EIIS v1.4 + ECL v2.0 conformance encoded"
    how_to_score: "eiis_v1_4_conformance + ecl_v2_0_conformance blocks present and non-empty."
  - id: 5
    criterion: "Memory-on/off A/B canary ready"
    how_to_score: ">=4 canary missions with ab_arm: true (CAN-1, CAN-3, CAN-4, CAN-5) and headline_ab_metric defined."
  - id: 6
    criterion: "Tier matrix unambiguous"
    how_to_score: "tier_matrix block — 12 rows x 4 columns; no '?' or 'tbd'."
  - id: 7
    criterion: "Trust propagation rule unambiguous"
    how_to_score: "G4 + tier_matrix_notes restate min(inputs.tier) rule."
  - id: 8
    criterion: "Importance function frozen at signature level"
    how_to_score: "config_defaults.importance_weights tuple present; source_of_truth_attribution flags importance.py as FROZEN signature."

scorecard_pass_bar: ">= 4 on every criterion. Any criterion at <=3 triggers SPECTRA re-run before W1 starts."
