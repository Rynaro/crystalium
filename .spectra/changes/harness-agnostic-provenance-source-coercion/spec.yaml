change_id: harness-agnostic-provenance-source-coercion
title: Harness-agnostic provenance.source coercion in commit
esl_tier: full
intent_type: BUG_SPEC
status_at_author: proposed
handoff_status: in_progress
maker: vivi
checker: vigil
author: spectra
implementer: apivr-delta
spec_date: "2026-06-29"
complexity: 7
confidence: 0.92
decision_gate: AUTO_PROCEED

goal: >
  Make crystalium.commit accept a descriptive/near-miss provenance.source (e.g.
  "spectra-planning-session") from any harness without a pydantic literal_error
  retry loop, by coercing server-side to a trust-class-correct enum value.

ecl_handoff:
  edge: spectra->apivr
  performative: PROPOSE
  envelope_version: "2.0"

coercion_contract:
  valid_literals: [human, verified_agent, unverified_agent, environment]
  rule_a_identity: "isinstance(raw,str) and raw in VALID -> return (raw, False)  # byte-for-byte"
  rule_b_fallback: "else (None|''|whitespace|other-string|non-str) -> (source_for_tier(caller_tier), True)"
  rule_c_invariant: "source_for_tier yields 'human' only for Tier.T0 -> never 'human' for non-T0 (C-2)"
  per_tier_fallback:
    T0: human            # allowed for T0 only
    T1: verified_agent   # the observed SPECTRA caller; == LLM successful manual retry
    T2: unverified_agent
    T3: unverified_agent
  author_agent: "untouched/verbatim — the descriptive label lives here (schemas.py:29), never lost"
  behavior_shift_absent_default:
    note: "absent-source default moves from hardcoded 'unverified_agent' to source_for_tier(caller_tier)"
    differs_only_for: [T0, T1]
    verified_no_test_pins_it: true

decision:
  id: DECISION-1
  question: silent vs observable coercion
  recommended: seamless_but_observable
  mechanism: >
    conditional 'provenance_coercion' field on the SUCCESS result dict (server.py:708/797),
    NOT the error-only advice channel (server.py:809-816). Attach nothing on the clean/IDENTITY
    path so the result is byte-identical to today (preserves ECL sha256 + result-shape asserts).
  advisory_shape: { field: source, from: "<raw>", to: "<final>" }
  flip_to_silent: "delete the advisory-attachment block in _handle_commit; coercion math + G-SOURCE-* + G-CREATEDAT-TOLERANT unaffected; only G-ADVISORY-OBSERVABLE dropped"

ground_truth:
  GT-1: { ref: "schemas.py:23-31,:28", fact: "Provenance, source Literal, extra=forbid" }
  GT-2: { ref: "server.py:959-964,:960", fact: "THE failure site — raw source into Literal" }
  GT-3: { ref: "server.py:956-958", fact: "GAP-1 created_at fromisoformat no try/except" }
  GT-4: { ref: "server.py:1055-1061", fact: "ingest tolerant pattern to mirror (Z-strip + try/except->now)" }
  GT-5: { ref: "ingest_adapter.py:125-127,:33-38", fact: "source_for_tier primitive already exists" }
  GT-6: { ref: "server.py:50,:55", fact: "ingest_adapter + Provenance already imported" }
  GT-7: { ref: "server.py:947", fact: "caller_tier:Tier already in scope at failure site" }
  GT-8: { ref: "protection.py:54-58", fact: "source=='human' -> permanent protection (why C-2)" }
  GT-9: { ref: "gate.py:341-351", fact: "witness independence keyed on (author_agent, source)" }
  GT-10: { ref: "ecl.py;server.py:708,787-790", fact: "ECL sha256 over result bytes; source not in envelope" }
  GT-11: { ref: "server.py:809-816", fact: "advice key is ERROR path only" }
  GT-12: { ref: "server.py:701-709,797;layers/episodic.py:257-264", fact: "success result dict — advisory rides here" }
  GT-13: { ref: "install.sh:328-343", fact: "frozen schemas verbatim-copied; widen breaks second-run-no-diff" }

scope:
  in:
    - source coercion in _handle_commit
    - created_at parse tolerance in _handle_commit (GAP-1)
    - observable advisory on success result (DECISION-1)
    - positive + identity regression tests
  out:
    - { item: "layer near-miss normalization (GAP-2)", reason: "OPTIONAL/stretch (Story S5); today structured UNKNOWN_LAYER, not raw ValidationError" }
    - { item: "_handle_ingest source (server.py:1062-1067)", reason: "adapter recomputes via source_for_tier — already enum-valid" }
    - { item: "__main__.py:168-173 source=human", reason: "not LLM-controlled" }
    - { item: "update", reason: "builds no Provenance; provenance in _UPDATE_PROTECTED_FIELDS (server.py:1100-1102)" }
    - { item: "widen schemas/*.v1.json or ECL envelope", reason: "frozen — escalation only (RISK-1)" }

primary_edit:
  file: mcp-server/src/crystalium/server.py
  function: _handle_commit
  lines: "956-964 (created_at parse + source construction); import source_for_tier at :50"
  helper_suggested_name: coerce_provenance_source
  applies_to_layers: [episodic, semantic, procedural]   # execution branch uses no provenance

stories:
  - id: S1
    title: provenance.source coercion (core)
    priority: P0
    timebox: 1d
    invest: true
    user_story: "As the LLM driving any harness, I want commit to accept a descriptive source so that I never hit a literal_error retry loop."
    action_plan:
      - "Extend import at server.py:50 to add source_for_tier"
      - "Add pure coerce_provenance_source(raw, caller_tier) -> (str, bool) per contract"
      - "Replace server.py:960 source=raw_prov.get('source','unverified_agent') with helper result"
    files: [mcp-server/src/crystalium/server.py]
    acceptance_checks: [G-SOURCE-COERCE-DESCRIPTIVE, G-SOURCE-IDENTITY, G-SOURCE-NEVER-HUMAN-NON-T0]
    agent_hint: { class: reasoner, gate: "make test-file F=mcp-server/tests/test_server.py" }
  - id: S2
    title: created_at parse tolerance (GAP-1)
    priority: P0
    timebox: 1d
    invest: true
    user_story: "As the LLM, I want commit to tolerate Z/epoch/non-ISO created_at so a timestamp shape never crashes the call."
    action_plan:
      - "server.py:956-958 mirror ingest: try fromisoformat(raw.replace('Z','+00:00')) except ValueError -> now_iso"
      - "Additionally handle numeric epoch via fromtimestamp(raw, tz=utc) guarded (ValueError,OSError,OverflowError) -> now_iso"
      - "On fallback, record a coercion note for S3"
    files: [mcp-server/src/crystalium/server.py]
    acceptance_checks: [G-CREATEDAT-TOLERANT]
    agent_hint: { class: builder, gate: "make test-file F=mcp-server/tests/test_server.py" }
  - id: S3
    title: observable advisory (DECISION-1)
    priority: P1
    timebox: 1d
    invest: true
    user_story: "As a debugging human, I want a non-fatal advisory when provenance was coerced so the reclassification is auditable without a retry."
    action_plan:
      - "When S1/S2 coercion fires, attach conditional provenance_coercion {field,from,to} to the result dict"
      - "Attach nothing on the IDENTITY/clean path (result byte-identical to today)"
    files: [mcp-server/src/crystalium/server.py]
    acceptance_checks: [G-ADVISORY-OBSERVABLE]
    agent_hint: { class: builder, gate: "make test-file F=mcp-server/tests/test_ecl_envelope.py" }
  - id: S4
    title: regression tests
    priority: P0
    timebox: 1d
    invest: true
    user_story: "As a maintainer, I want positive + identity tests so the seam can't silently regress."
    action_plan:
      - "Add to test_server.py: positive (descriptive->verified_agent, committed), identity (4 valid unchanged + author_agent preserved)"
      - "never-human-non-T0 guard (near test_protected.py)"
      - "created_at cases: epoch int, Z, garbage->fallback"
      - "advisory present only on coercion, absent on clean path"
    files: [mcp-server/tests/test_server.py, mcp-server/tests/test_protected.py]
    acceptance_checks: [G-SOURCE-COERCE-DESCRIPTIVE, G-SOURCE-IDENTITY, G-SOURCE-NEVER-HUMAN-NON-T0, G-CREATEDAT-TOLERANT, G-ADVISORY-OBSERVABLE, G-EXISTING-TESTS-GREEN]
    agent_hint: { class: builder, gate: "make test" }
  - id: S5
    title: layer near-miss normalization (GAP-2)
    priority: P2
    optional: true
    stretch: true
    timebox: 1d
    note: "Ship S1-S4 independently. S5 must NOT block the core fix."
    user_story: "As the LLM, I want near-miss layer tokens normalized so a descriptive layer name doesn't force a retry."
    action_plan:
      - "Before the layer== dispatch (server.py:973-986), map known aliases -> canonical via a small table"
      - "Unknown layer still raises structured UNKNOWN_LAYER (server.py:982-986)"
      - "Emit a layer_coercion advisory consistent with S3"
    files: [mcp-server/src/crystalium/server.py]
    acceptance_checks: [G-LAYER-NORMALIZE]
    agent_hint: { class: builder, gate: "make test-file F=mcp-server/tests/test_server.py" }

acceptance_gates:
  - id: G-SOURCE-COERCE-DESCRIPTIVE
    priority: P0
    given: a T1 caller
    when: commit is called with provenance.source="spectra-planning-session" and a valid author_agent
    then: status=="committed", stored provenance.source=="verified_agent", author_agent preserved verbatim, no ValidationError
    verify_method: pytest (new test in test_server.py via make test-file)
  - id: G-SOURCE-IDENTITY
    priority: P0
    given: any of {human, verified_agent, unverified_agent, environment} as source
    when: commit is called
    then: stored source is byte-for-byte identical AND no provenance_coercion advisory attached
    verify_method: pytest (new test)
  - id: G-SOURCE-NEVER-HUMAN-NON-T0
    priority: P0
    given: a non-T0 caller (T1/T2/T3)
    when: source is absent/empty/descriptive
    then: coerced source is never "human" (verified_agent for T1, unverified_agent for T2/T3); no spurious permanent protection
    verify_method: pytest (new guard test near test_protected.py)
  - id: G-CREATEDAT-TOLERANT
    priority: P0
    given: created_at as epoch int, Z-suffixed ISO, or non-ISO garbage
    when: commit is called
    then: parses where possible (epoch/Z) or safely falls back to server-now (garbage); never crashes
    verify_method: pytest (new test)
  - id: G-ADVISORY-OBSERVABLE
    priority: P1
    given: a coercion fires (source and/or created_at)
    when: commit succeeds
    then: result carries non-fatal provenance_coercion {field,from,to}; given no coercion, no advisory field present
    verify_method: pytest (new test + test_ecl_envelope.py)
  - id: G-NO-SCHEMA-DRIFT
    priority: P0
    given: the fix is applied
    when: the tree is inspected
    then: no schemas/*.v1.json, no ECL envelope schema, no install.manifest.json modified; install.sh second-run-no-diff green
    verify_method: "git diff --stat schemas/ install.manifest.json empty; install idempotency CI job"
  - id: G-EXISTING-TESTS-GREEN
    priority: P0
    given: the full suite
    when: make test runs in-container
    then: all 8 gates pass; test_promotion_gate.py:215-255, test_protected.py, test_trust_propagation.py, test_ecl_envelope.py unchanged and green
    verify_method: make test
  - id: G-LAYER-NORMALIZE
    priority: P2
    optional: true
    given: layer="episodic-memory" or "memory"
    when: commit is called
    then: routes to episodic and succeeds; unknown layer still returns structured UNKNOWN_LAYER (not a crash)
    verify_method: pytest (optional test)

risks:
  RISK-1: { risk: "widen frozen Literal/JSON schema", mitigation: "C-1 + G-NO-SCHEMA-DRIFT; widen is escalation only; H2 rejected" }
  RISK-2: { risk: "coerce to human for non-T0 -> permanent protection (W4 breach)", mitigation: "route FALLBACK through source_for_tier; G-SOURCE-NEVER-HUMAN-NON-T0" }
  RISK-3: { risk: "descriptive strings collapse -> narrows witness independence", mitigation: "accepted; better than rejection; author_agent still differentiates" }
  RISK-4: { risk: "absent-default shift surprises a pinned test", mitigation: "verified none pin it; G-EXISTING-TESTS-GREEN backstops" }
  RISK-5: { risk: "advisory field breaks a result-shape assertion", mitigation: "conditional attach; clean path byte-identical" }

rejected_alternatives:
  H2_widen_schema: "violates C-1/RISK-1 (frozen schema -> install second-run-diff); launders trust; escalation-only path"
  H3_pydantic_validator: "cannot see caller_tier (not a model field; extra=forbid) -> cannot honor C-2 cleanly; fires at every Provenance site"
  H4_catch_retry: "reconstructs Provenance twice; still needs tier mapping; strictly more code"

container_first:
  forbidden_on_host: [python, pip, uv, pytest]
  commands:
    full_suite: make test
    focused: "make test-file F=mcp-server/tests/test_server.py"
    lint: make lint
    typecheck: make typecheck
    schema: make schema

definition_of_done:
  - all P0 gates green via make test in-container
  - "git diff shows zero changes under schemas/ and to install.manifest.json"
  - GIVEN/WHEN/THEN map 1:1 to change.json acceptance_checks
  - "Vigil drift-checks (checker != maker) at delivered before archive"
