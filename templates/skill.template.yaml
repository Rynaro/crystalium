# Procedural skill template — matches schemas/skill.v1.json
# Copy this file, fill in every field, then commit via:
#   crystalium.commit(layer="procedural", payload=<skill_dict>, provenance=...)
#
# Status progression: candidate → admitted (via skill_invoke verifier-pass)
#                     admitted → shared (via k-corroboration OR human-confirm)
#                     any → deprecated (via Dream prune)

---
name: "my-skill-name"               # REQUIRED. Unique slug. max 128 chars.
capability_class: "test-execution"  # REQUIRED. Free-form class label.
description: >-
  One sentence describing what this skill does and when to use it.
  Max 2048 chars.
language: "bash"                    # REQUIRED. One of: python|ts|sql|bash|none
inputs:
  - name: "input_name"
    type: "string"                  # Python type hint string
    description: "What this input controls"
    required: true
verifier: |
  #!/usr/bin/env bash
  set -euo pipefail
  # Verifier script: exits 0 on success, non-zero on failure.
  # Bounds: 30s timeout, 8192 bytes output cap (D5).
  # Workdir: /sandbox/<skill_id>
  echo "VERIFIER_PASS"
provenance:
  source: "verified_agent"          # human|verified_agent|unverified_agent|environment
  author_agent: "apivr"             # agent slug or null
  task_id: "task-XXX"               # optional task identifier
  created_at: "2026-05-28T00:00:00Z"
trust_tier: "T1"                    # T0|T1|T2 (T3 cannot commit Procedural)
success_count: 0
last_used: null
status: "candidate"                 # start as candidate; skill_invoke promotes to admitted
activation_conditions: null         # optional dict of {trigger: condition}
