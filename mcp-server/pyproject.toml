# pyproject.toml — crystalium MCP server
# Managed by uv. Run INSIDE the Docker container; do NOT run 'uv sync' on the host.
# uv.lock is generated inside the container on 'docker build'; it is gitignored.
# See: MISSION.md §"Container-first" + crystalium-v0.1.0-spec.yaml §container_first_protocol

[project]
name = "crystalium"
version = "0.8.0"
description = "Portable memory harness for the Eidolons — MCP-compatible, self-hosted, vendor-agnostic"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Henrique Aparecido Lavezzo", email = "5271543+Rynaro@users.noreply.github.com"},
]

dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "lancedb>=0.6",
    "kuzu>=0.4",
    "sentence-transformers>=2.7",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "click>=8.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "opentelemetry-sdk>=1.20",
    "tiktoken>=0.6",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "jsonschema>=4.21",
]

[project.scripts]
crystalium = "crystalium.__main__:cli"

[project.urls]
Homepage = "https://github.com/Rynaro/crystalium"
Repository = "https://github.com/Rynaro/crystalium"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crystalium"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow'); set CRYSTALIUM_SKIP_SLOW=1",
    "conformance: mechanical-invariant conformance gate (G1-G8 + path-escape/rate-limit/never-hard-delete/working-set); 'pytest -m conformance' green == conformant (W8)",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
