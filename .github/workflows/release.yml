name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Required for manual runs."
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/crystalium

jobs:
  publish-image:
    name: Build + push container to GHCR
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.inputs.tag }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: imgname
        run: |
          # GHCR rejects uppercase namespaces; lowercase the org slug.
          lower=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/$lower" >> "$GITHUB_OUTPUT"

      - name: Build + push (release target, not dev)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: base
          push: true
          tags: |
            ${{ steps.imgname.outputs.image }}:${{ steps.ref.outputs.version }}
            ${{ steps.imgname.outputs.image }}:latest
          provenance: true
          sbom: true

      - name: Print digest
        run: |
          echo "Published ${{ steps.imgname.outputs.image }}:${{ steps.ref.outputs.version }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  github-release:
    name: Create GitHub release
    needs: publish-image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            CRYSTALIUM ${{ github.ref_name }} — portable memory harness for the Eidolons.

            **Container image:**
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/crystalium:${{ github.ref_name }}
            ```

            Digest: `${{ needs.publish-image.outputs.digest }}`

            See `CHANGELOG.md` for details.
