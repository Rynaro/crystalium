name: EIIS + ECL Conformance

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      eiis_ref:
        description: "eidolons-eiis branch/tag to clone for conformance check"
        required: false
        default: "main"

jobs:
  eiis-1-4:
    name: EIIS v1.4 conformance
    runs-on: ubuntu-latest
    # TODO(v0.2): remove continue-on-error once eidolons-eiis conformance
    # checker is published and callable without GitHub credentials.
    # VIGIL: flag this as a deferred conformance gap in the evaluate report.
    continue-on-error: true
    steps:
      - name: Checkout crystalium
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker compose build crystalium

      # docker-compose.yml bind-mounts ".:/app", which HIDES the image's baked
      # /app/.venv — so `docker compose run ... uv run ...` cannot find pytest or
      # the install deps (see ci.yml header). These jobs therefore use plain
      # `docker run` against crystalium:dev (the baked image is the source of
      # truth) and bind-mount only the host target dir so the manifest written by
      # install.sh survives the --rm container for the validate step.
      - name: Prepare host install-target directory
        run: |
          mkdir -p /tmp/eiis-check-target
          # World-writable so the container UID can write inside the bind-mount
          chmod 777 /tmp/eiis-check-target

      - name: Run install.sh to produce install target
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "$(pwd):/workspace" \
            -v "/tmp/eiis-check-target:/tmp/eiis-check-target" \
            -w /workspace \
            crystalium:dev \
            install.sh --target /tmp/eiis-check-target --non-interactive

      - name: Validate install target against EIIS v1.4 §1.9.1 whitelist (local stub)
        run: |
          docker run --rm \
            -v "/tmp/eiis-check-target:/tmp/eiis-check-target" \
            --entrypoint python3 \
            crystalium:dev \
            -c "
          import json, os, sys

          TARGET = '/tmp/eiis-check-target'
          MANIFEST = os.path.join(TARGET, 'install.manifest.json')

          # Load manifest
          try:
              m = json.load(open(MANIFEST))
          except Exception as e:
              print(f'FAIL: manifest unreadable: {e}', file=sys.stderr)
              sys.exit(1)

          fw = m.get('files_written', [])
          fw_paths = {e['path'] for e in fw}
          fw_roles = {e['role'] for e in fw}

          errors = []

          # §1.8.6: exactly one agent-profile
          agent_profiles = [e for e in fw if e.get('role') == 'agent-profile']
          if len(agent_profiles) != 1:
              errors.append(f'§1.8.6: expected 1 agent-profile entry, got {len(agent_profiles)}')

          # §1.8.1: exactly one spec
          specs = [e for e in fw if e.get('role') == 'spec']
          if len(specs) != 1:
              errors.append(f'§1.8.1: expected 1 spec entry, got {len(specs)}')

          # §3.7.1: ECL_VERSION must appear with role=ecl-version
          ecl_entries = [e for e in fw if e.get('role') == 'ecl-version']
          if not os.path.exists(os.path.join(TARGET, 'ECL_VERSION')):
              errors.append('§3.7.1: ECL_VERSION not present in install target')
          elif len(ecl_entries) != 1:
              errors.append(f'§3.7.1: expected 1 ecl-version entry, got {len(ecl_entries)}')

          # §1.9.1: no forbidden paths
          FORBIDDEN_BASENAMES = {
              'CRYSTALIUM.md', 'AGENTS.md', 'CLAUDE.md', 'README.md',
              'CHANGELOG.md', 'DESIGN-RATIONALE.md', 'MISSION.md',
              'SKILL.md', 'Dockerfile', 'docker-compose.yml', 'pyproject.toml',
          }
          FORBIDDEN_DIRS = {'hosts', 'evals', 'research', 'tools', 'commands', 'mcp-server'}

          for root, dirs, files in os.walk(TARGET):
              for f in files:
                  if f in FORBIDDEN_BASENAMES:
                      rel = os.path.relpath(os.path.join(root, f), TARGET)
                      errors.append(f'§1.9.3: forbidden file in install target: {rel}')
              for d in list(dirs):
                  if d in FORBIDDEN_DIRS:
                      errors.append(f'§1.9.3: forbidden dir in install target: {d}')
                      dirs.remove(d)

          # §6.Y: agent.md skill references must resolve to files_written entries
          agent_md_dst = os.path.join(TARGET, 'agent.md')
          if os.path.exists(agent_md_dst):
              content = open(agent_md_dst).read()
              import re
              skill_refs = re.findall(r'skills/([^/\s\"]+\.md)', content)
              for sr in skill_refs:
                  if not any(sr in p for p in fw_paths):
                      errors.append(f'§6.Y: agent.md references skill not in files_written[]: {sr}')

          if errors:
              print('EIIS v1.4 conformance FAILURES:')
              for e in errors:
                  print(f'  {e}', file=sys.stderr)
              sys.exit(1)
          else:
              print('EIIS v1.4 conformance: PASS (local stub check)')
          "

  ecl-2-0:
    name: ECL v2.0 envelope conformance
    runs-on: ubuntu-latest
    # TODO(v0.2): validate against eidolons-ecl/schemas/envelope.v2.json
    # once the ECL repo is publicly cloneable in CI.
    # VIGIL: flag this as a deferred conformance gap.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker compose build crystalium

      # Use plain `docker run` against the baked crystalium:dev image — NOT
      # `docker compose run`, whose ".:/app" bind-mount hides the baked
      # /app/.venv and makes `uv run pytest` fail with "Failed to spawn: pytest"
      # (see ci.yml header). Tests are baked at /app/tests, ECL_VERSION at /app.
      - name: Run ECL envelope test
        run: |
          docker run --rm \
            -e CRYSTALIUM_SKIP_SLOW=1 \
            crystalium:dev \
            pytest tests/test_ecl_envelope.py -v --tb=short -p no:cacheprovider

      - name: Validate ECL_VERSION matches declared version
        run: |
          docker run --rm \
            --entrypoint python3 \
            crystalium:dev \
            -c "
          ecl_ver = open('ECL_VERSION').read().strip()
          assert ecl_ver == '2.0', f'ECL_VERSION must be 2.0, got {ecl_ver!r}'
          print(f'ECL_VERSION = {ecl_ver} — PASS')
          "
