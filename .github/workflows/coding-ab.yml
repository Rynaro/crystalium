name: Coding memory A/B calibration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  fixture-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        run: docker compose build crystalium
      - name: Offline paired smoke, identical repeated reports
        run: |
          docker run --rm --network none crystalium:dev python -m evals.coding_ab \
            --check-determinism --out /tmp/coding-ab \
            --expected-report /app/evals/coding_ab/results/fixture/report.json
