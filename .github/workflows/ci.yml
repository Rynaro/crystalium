name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# Why every job uses `docker run` instead of `docker compose run`:
#
#   docker-compose.yml bind-mounts ".:/app" (and "crystalium_data:/root/.crystalium")
#   for live dev iteration. Inside CI the bind-mount HIDES the image's baked
#   /app/pyproject.toml and /app/.venv — so `uv run pytest` creates a fresh
#   venv with no deps and cannot find pytest. The image already contains
#   everything we need; CI should treat it as the source of truth.
#
#   The idempotency job still needs the repo source on disk (install.sh lives
#   there, not in the image), so it mounts the workspace to /workspace
#   explicitly and overrides the entrypoint to `bash`.

jobs:
  test:
    name: pytest (container)
    runs-on: ubuntu-latest
    env:
      CRYSTALIUM_SKIP_SLOW: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        run: docker compose build crystalium

      - name: Run pytest suite
        run: |
          docker run --rm \
            -e CRYSTALIUM_SKIP_SLOW=1 \
            crystalium:dev \
            pytest tests/ -v --tb=short -p no:cacheprovider

  conformance:
    name: conformance suite (G1-G8 + invariants)
    runs-on: ubuntu-latest
    env:
      CRYSTALIUM_SKIP_SLOW: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        run: docker compose build crystalium

      # W8: "green == conformant". BLOCKING (no continue-on-error) — a regression in
      # any mechanical invariant (tier×layer×op, path-escape, rate-limit, ECL
      # integrity, MIN-tier propagation, never-hard-delete + RTBF, working-set cap)
      # fails the PR check, not just the undifferentiated full-suite run.
      - name: Run conformance suite
        run: |
          docker run --rm \
            -e CRYSTALIUM_SKIP_SLOW=1 \
            crystalium:dev \
            pytest -m conformance -v --tb=short -p no:cacheprovider

  ownership:
    name: bind-mount ownership (container writes are host-deletable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        run: docker compose build crystalium

      # crystalium#66. Every other job in this file runs `docker run` against the
      # baked image with NO bind mount, so none of them can observe this defect —
      # the tree the container writes into is the image's own filesystem, thrown
      # away with the container. Only `docker compose run` reproduces the developer
      # path where /app is the host checkout.
      #
      # Red-checked before landing: with the `user:` key removed from
      # docker-compose.yml this step fails with 22 undeletable paths, so it is a
      # live gate and not a formality.
      - name: Assert container writes stay host-deletable
        run: make check-ownership

  schema-validate:
    name: JSON schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        run: docker compose build crystalium

      - name: Validate all schemas/*.json
        run: |
          docker run --rm crystalium:dev python - <<'PY'
          import json, glob, sys
          errors = []
          for f in sorted(glob.glob('schemas/*.json')):
              try:
                  json.load(open(f))
              except json.JSONDecodeError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('SCHEMA ERRORS:')
              for e in errors:
                  print(' ', e, file=sys.stderr)
              sys.exit(1)
          print(f'All {len(list(glob.glob("schemas/*.json")))} schemas valid.')
          PY

  idempotency:
    name: install.sh idempotency (second run no-diff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        run: docker compose build crystalium

      - name: Prepare host directories
        run: |
          mkdir -p /tmp/crystalium-install-test /tmp/snapshots
          # World-writable so the container UID can write inside the bind-mount
          chmod 777 /tmp/crystalium-install-test /tmp/snapshots

      - name: First install run
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "$(pwd):/workspace" \
            -v "/tmp/crystalium-install-test:/tmp/crystalium-install-test" \
            -w /workspace \
            crystalium:dev \
            install.sh --target /tmp/crystalium-install-test --non-interactive --force

      - name: Snapshot 1
        run: |
          find /tmp/crystalium-install-test -type f | sort | tee /tmp/snapshots/snapshot1.txt

      - name: Second install run (must be no-op)
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "$(pwd):/workspace" \
            -v "/tmp/crystalium-install-test:/tmp/crystalium-install-test" \
            -w /workspace \
            crystalium:dev \
            install.sh --target /tmp/crystalium-install-test --non-interactive --force

      - name: Assert no new files appeared
        run: |
          find /tmp/crystalium-install-test -type f | sort > /tmp/snapshots/snapshot2.txt
          if diff /tmp/snapshots/snapshot1.txt /tmp/snapshots/snapshot2.txt; then
            echo 'PASS: install target file list unchanged after second run'
          else
            echo 'FAIL: install target changed on second run (idempotency violation)' >&2
            exit 1
          fi
