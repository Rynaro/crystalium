name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: pytest (docker compose)
    runs-on: ubuntu-latest
    env:
      CRYSTALIUM_SKIP_SLOW: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker compose build

      - name: Run pytest suite
        run: |
          docker compose run --rm crystalium \
            pytest mcp-server/tests/ -v --tb=short

  schema-validate:
    name: JSON schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker compose build

      - name: Validate all schemas/*.json
        run: |
          docker compose run --rm crystalium \
            python -c "
          import json, glob, sys
          errors = []
          for f in sorted(glob.glob('schemas/*.json')):
              try:
                  json.load(open(f))
              except json.JSONDecodeError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('SCHEMA ERRORS:')
              for e in errors:
                  print(' ', e, file=sys.stderr)
              sys.exit(1)
          print(f'All {len(list(glob.glob(\"schemas/*.json\")))} schemas valid.')
          "

  idempotency:
    name: install.sh idempotency (second run no-diff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker compose build

      - name: First install run
        run: |
          docker compose run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            crystalium \
            bash install.sh --target /tmp/crystalium-install-test --non-interactive

      - name: Snapshot install target (excluding install.ts in manifest)
        run: |
          docker compose run --rm \
            -v "$(pwd):/workspace" \
            -v "/tmp/crystalium-install-test:/tmp/crystalium-install-test" \
            -w /workspace \
            crystalium \
            bash -c "find /tmp/crystalium-install-test -type f | sort > /tmp/snapshot1.txt && cat /tmp/snapshot1.txt"

      - name: Second install run (must be no-op)
        run: |
          docker compose run --rm \
            -v "$(pwd):/workspace" \
            -v "/tmp/crystalium-install-test:/tmp/crystalium-install-test" \
            -w /workspace \
            crystalium \
            bash install.sh --target /tmp/crystalium-install-test --non-interactive

      - name: Assert no new files appeared
        run: |
          docker compose run --rm \
            -v "/tmp:/tmp" \
            crystalium \
            bash -c "
              find /tmp/crystalium-install-test -type f | sort > /tmp/snapshot2.txt
              if diff /tmp/snapshot1.txt /tmp/snapshot2.txt; then
                echo 'PASS: install target file list unchanged after second run'
              else
                echo 'FAIL: install target changed on second run (idempotency violation)' >&2
                exit 1
              fi
            "
